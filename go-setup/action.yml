name: 'Go Setup'
description: 'Setup Go with private Sourcegraph repo access'

inputs:
  go-version:
    description: 'Go version to use (overrides go-version-file if set)'
    required: false
    default: ''
  go-version-file:
    description: 'Path to go.mod or go.work file to determine Go version'
    required: false
    default: 'go.mod'
  private-token:
    description: 'Token for accessing private Sourcegraph repos'
    required: false
    default: ''
  goprivate:
    description: 'Comma-separated list of module path prefixes for GOPRIVATE'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version || '' }}
        go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}

    - name: Configure git for private repos
      if: inputs.private-token != ''
      shell: bash
      run: git config --global url."https://${{ inputs.private-token }}@github.com/sourcegraph/".insteadOf "https://github.com/sourcegraph/"

    - name: Set Go environment
      if: inputs.private-token != ''
      shell: bash
      run: |
        if [ -n "${{ inputs.goprivate }}" ]; then
          echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"
        fi
        echo "GOPROXY=https://proxy.golang.org" >> "$GITHUB_ENV"

name: 'Go Setup'
description: 'Setup Go with private Sourcegraph repo access'

inputs:
  go-version:
    description: 'Go version to use (overrides go-version-file if set)'
    required: false
    default: ''
  go-version-file:
    description: 'Path to go.mod or go.work file to determine Go version'
    required: false
    default: 'go.mod'
  private-token:
    description: 'Token for accessing private Sourcegraph repos'
    required: false
    default: ''
  goprivate:
    description: 'Comma-separated list of module path prefixes for GOPRIVATE'
    required: false
    default: ''
  cache:
    description: >-
      Use actions/setup-go's built-in module and build cache. Set to false when
      the workflow manages its own cache, e.g. because several jobs on the same
      OS would otherwise share one cache key.
    required: false
    default: 'true'
  cache-dependency-path:
    description: >-
      Glob(s) of files whose hash forms the cache key, one per line. Defaults
      to go.sum in the repository root; set it when nested modules have their
      own go.sum.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version || '' }}
        go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Configure git for private repos
      if: inputs.private-token != ''
      shell: bash
      run: git config --global url."https://${{ inputs.private-token }}@github.com/sourcegraph/".insteadOf "https://github.com/sourcegraph/"

    - name: Set Go environment
      if: inputs.private-token != ''
      shell: bash
      run: |
        if [ -n "${{ inputs.goprivate }}" ]; then
          echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"
        fi
        echo "GOPROXY=https://proxy.golang.org" >> "$GITHUB_ENV"

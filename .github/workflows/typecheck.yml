name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # We're doing this to remove the need for a build step from our actions
      - name: Ensure no .ts/.tsx source files
        run: |
          ts_files=$(find . -not -path './node_modules/*' -not -path './.git/*' \( -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$ts_files" ]; then
            echo "Found .ts/.tsx files. This repo must stay pure JavaScript to avoid a build step:" >&2
            echo "$ts_files" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

name: Diff Tour link

on:
  pull_request:
    # `edited` fires when the base branch changes; `synchronize` does not.
    # `closed` fires on merge and on plain close; either way the comment is
    # updated to a link that survives deleting the head branch.
    types: [closed, edited, opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  diff-tour:
    runs-on: ubuntu-latest
    # Diff Tour resolves branch names against the base repo, so skip fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # This repo differs from consumers: it runs its own copy of the action
      # via a local path so PRs to diff-tour exercise their own changes. Local
      # `uses: ./path` requires the repo checked out first, and checkout works
      # here without `contents: read` only because this repo is public.
      # Consumers use `uses: sourcegraph/actions/diff-tour@main` and need no
      # checkout; see diff-tour/README.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./diff-tour
